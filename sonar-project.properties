# SonarQube Cloud (free plan). Keys as SonarQube Cloud generates them when importing the GitHub repo.
sonar.organization=linaressss073
sonar.projectKey=Linaressss073_IPS
sonar.projectName=IPS

sonar.sources=api/src,multi-tenant-starter-template/app,multi-tenant-starter-template/components,multi-tenant-starter-template/lib
sonar.tests=api/src,api/test,multi-tenant-starter-template/lib
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/openapi-responses.generated.ts,**/openapi.json,**/schema.d.ts
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info,api/coverage-e2e/lcov.info

# Coverage is measured on the API business code (unit + e2e). Left out: bootstrap, Nest wiring, one-off
# scripts, persistence documents and type-only files, and the frontend (no component tests yet).
sonar.coverage.exclusions=api/src/main.ts,api/src/scripts/**,**/*.module.ts,**/*.document.ts,**/*.types.ts,**/*.constants.ts,**/index.ts,**/*.fake.ts,multi-tenant-starter-template/**

# S1998 (async sin await): los repositorios en memoria y los dobles de prueba implementan
# puertos que devuelven promesas; un getById que lanza debe rechazar, no lanzar en sincrónico.
# S9423 (!important): la regla de "reducir movimiento" de globals.css debe ganarle a las utilidades de
# Tailwind (animate-*, transition-*), que tienen mayor especificidad que "*"; es el patrón estándar de accesibilidad.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e5.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.e5.resourceKey=multi-tenant-starter-template/app/globals.css
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1998
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.fake.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1998
sonar.issue.ignore.multicriteria.e2.resourceKey=api/test/support/**
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.fake.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.e4.resourceKey=api/test/support/**
