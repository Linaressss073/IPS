# SonarQube Cloud (free plan). Keys as SonarQube Cloud generates them when importing the GitHub repo.
sonar.organization=linaressss073
sonar.projectKey=Linaressss073_IPS
sonar.projectName=IPS

sonar.sources=api/src,multi-tenant-starter-template/app,multi-tenant-starter-template/components,multi-tenant-starter-template/lib
sonar.tests=api/src,api/test
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info

# S1998 (async sin await): los repositorios en memoria y los dobles de prueba implementan
# puertos que devuelven promesas; un getById que lanza debe rechazar, no lanzar en sincrónico.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1998
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.fake.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1998
sonar.issue.ignore.multicriteria.e2.resourceKey=api/test/support/**
