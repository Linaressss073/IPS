# Render Blueprint (New → Blueprint → this repo): the API and the web app in the
# "Practica" project. The only database is MongoDB Atlas (MONGO_URL).
#
# Keys with `sync: false` are secrets: Render asks for them once and they never
# live in git.
#
# If Render assigns other URLs than ips-api/ips-web.onrender.com, update
# CORS_ORIGIN (api/deployment/config.json, prod) and NEXT_PUBLIC_API_URL (web)
# and redeploy both:
# NEXT_PUBLIC_* values are baked into its build.
#
# pnpm runs through npx: Render's global npm folder (/usr/lib) is read-only,
# so `npm install -g pnpm` fails with EROFS.

version: "1"
projects:
  - name: Practica
    environments:
      - name: Production
        services:
          - type: web
            name: ips-api
            runtime: node
            plan: free
            region: oregon
            branch: main
            rootDir: api
            buildCommand: npx --yes pnpm@12.6.0 install --frozen-lockfile && npx --yes pnpm@12.6.0 build
            # TEMPORARY: copies the data from the old "test" database into
            # his_consulta_externa and rebuilds it from the old MongoDB copies
            # (insert-only, idempotent) before starting. Removed after one deploy.
            startCommand: (RECOVER_FROM_DB=test node dist/scripts/recover-from-timeline.js || echo "recover-from-timeline failed") && node dist/main
            healthCheckPath: /api/v1/health
            envVars:
              - key: NODE_VERSION
                value: "24"
              # Picks the "prod" settings of api/deployment/config.json (CORS);
              # these variables override them.
              - key: ENV
                value: prod
              # Same Clerk application as the web app; its tokens are only
              # accepted from CORS_ORIGIN (authorized parties).
              - key: CLERK_SECRET_KEY
                sync: false
              # Clerk → Webhooks → https://ips-api-3404.onrender.com/api/v1/webhooks/clerk
              # (user.*, organization.*, organizationMembership.*): its signing secret.
              - key: CLERK_WEBHOOK_SIGNING_SECRET
                sync: false
              # MongoDB Atlas, the only database. The database name is MONGO_DB_NAME
              # (api/deployment/config.json: his_consulta_externa), not the URL.
              - key: MONGO_URL
                sync: false

          - type: web
            name: ips-web
            runtime: node
            plan: free
            region: oregon
            branch: main
            rootDir: multi-tenant-starter-template
            buildCommand: npx --yes pnpm@12.6.0 install --frozen-lockfile && npx --yes pnpm@12.6.0 build
            startCommand: npx next start
            envVars:
              - key: NODE_VERSION
                value: "24"
              # NEXT_PUBLIC_* values are baked into the build.
              - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
                sync: false
              - key: CLERK_SECRET_KEY
                sync: false
              - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
                value: /sign-in
              - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
                value: /sign-up
              - key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
                value: /dashboard
              - key: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
                value: /dashboard
              # Without /api/v1: the client adds the prefix.
              - key: NEXT_PUBLIC_API_URL
                value: https://ips-api-3404.onrender.com
