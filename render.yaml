# Render Blueprint (New → Blueprint → this repo): the API and the web app in the
# "Practica" project, wired to the existing ips-db-postgres database.
#
# The database block mirrors the one exported from Render so the Blueprint
# adopts it instead of creating another. Keys with `sync: false` are secrets:
# Render asks for them once and they never live in git.
#
# If Render assigns other URLs than ips-api/ips-web.onrender.com, update
# CORS_ORIGIN (API) and NEXT_PUBLIC_API_URL (web) and redeploy the web app:
# NEXT_PUBLIC_* values are baked into its build.
#
# pnpm runs through npx: Render's global npm folder (/usr/lib) is read-only,
# so `npm install -g pnpm` fails with EROFS.

version: "1"
projects:
  - name: Practica
    environments:
      - name: Production
        databases:
          - name: ips-db-postgres
            databaseName: ips_db_postgres
            user: ips_db_postgres_user
            plan: free
            region: oregon
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere
            postgresMajorVersion: "18"

        services:
          - type: web
            name: ips-api
            runtime: node
            plan: free
            region: oregon # same region as the database: the internal URL only resolves there
            branch: main
            rootDir: api
            buildCommand: npx --yes pnpm@12.6.0 install --frozen-lockfile && npx --yes pnpm@12.6.0 build
            # Migrations run at start: builds can't reach Render's private network.
            startCommand: npx drizzle-kit migrate && node dist/main
            healthCheckPath: /api/v1/health
            envVars:
              - key: NODE_VERSION
                value: "24"
              # Internal connection string of the database (private network).
              - key: DATABASE_URL
                fromDatabase:
                  name: ips-db-postgres
                  property: connectionString
              - key: CORS_ORIGIN
                value: https://ips-web.onrender.com
              - key: HEXCLAVE_API_URL
                value: https://api.hexclave.com
              - key: HEXCLAVE_PROJECT_ID
                value: 19322352-710d-49a8-afa3-b5b3cdf0e893
              - key: HEXCLAVE_SECRET_SERVER_KEY
                sync: false
              # Timeline read from Postgres. To use Mongo (e.g. Atlas), add
              # MONGO_URL in the dashboard and set this to "mongo".
              - key: TIMELINE_STORE
                value: postgres
              - key: RELAY_INTERVAL_MS
                value: "500"

          - type: web
            name: ips-web
            runtime: node
            plan: free
            region: oregon
            branch: main
            rootDir: multi-tenant-starter-template
            buildCommand: npx --yes pnpm@12.6.0 install --frozen-lockfile && npx --yes pnpm@12.6.0 build
            startCommand: npx next start
            envVars:
              - key: NODE_VERSION
                value: "24"
              - key: NEXT_PUBLIC_HEXCLAVE_PROJECT_ID
                value: 19322352-710d-49a8-afa3-b5b3cdf0e893
              - key: HEXCLAVE_SECRET_SERVER_KEY
                sync: false
              # Without /api/v1: the client adds the prefix.
              - key: NEXT_PUBLIC_API_URL
                value: https://ips-api.onrender.com
