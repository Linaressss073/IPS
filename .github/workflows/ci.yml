# Each stage runs only if the previous one passed:
#   lint-api -> build-api + unit-api -> e2e-api -> sonar
#   web (independent)
#   ci-ok (needs all) -> the check Render waits for (autoDeployTrigger: checksPass).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with: { working-directory: api }
      - run: pnpm lint
        working-directory: api

  build-api:
    needs: lint-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with: { working-directory: api }
      - run: pnpm build
        working-directory: api
      # The OpenAPI response schemas are generated from the controllers and committed.
      - name: OpenAPI schemas are up to date
        run: git diff --exit-code -- api/src/docs || (echo "Run pnpm docs:generate in api/ and commit" && exit 1)

  unit-api:
    needs: lint-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with: { working-directory: api }
      - run: pnpm test:cov --coverage.reporter=lcov
        working-directory: api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-unit
          path: api/coverage/lcov.info

  e2e-api:
    needs: [build-api, unit-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with: { working-directory: api }
      # Testcontainers starts MongoDB (replica set) from global-setup.
      - run: pnpm test:e2e --coverage --coverage.reporter=lcov --coverage.reportsDirectory=coverage-e2e
        working-directory: api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-e2e
          path: api/coverage-e2e/lcov.info

  sonar:
    needs: e2e-api
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Sonar attributes new code from the full history.
      # Unit + e2e coverage; Sonar merges both reports.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-unit
          path: api/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-e2e
          path: api/coverage-e2e
      - name: SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        with:
          # Fails the CI when the quality gate fails (coverage on new code >= 80 %, no new issues).
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-pnpm
        with: { working-directory: multi-tenant-starter-template }
      # next build compiles and type-checks.
      - run: pnpm build
        working-directory: multi-tenant-starter-template

  ci-ok:
    needs: [lint-api, build-api, unit-api, e2e-api, sonar, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every stage passed or was skipped on purpose
        run: |
          echo '${{ toJSON(needs) }}' | grep -E '"result": "(failure|cancelled)"' && exit 1 || echo ok
