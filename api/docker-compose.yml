# MongoDB for development and the e2e tests. It runs as a one-node replica
# set because the API writes each change and its trace events in a
# transaction. Port 27018 so it never collides with another local MongoDB.
services:
  mongo:
    image: mongo:8
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27018']
    ports:
      - '27018:27018'
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Initiates the replica set on first start; afterwards just reports it.
      test:
        - CMD
        - mongosh
        - --port
        - '27018'
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27018' }] }).ok }"
      interval: 5s
      retries: 20
      start_period: 5s

volumes:
  mongodata:
