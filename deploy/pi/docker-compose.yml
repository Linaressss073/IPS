# Raspberry Pi: se copia a ~/docker/b2b junto a up.sh. El .env NO se edita a mano: lo genera up.sh desde OpenBao.
# Solo escucha en 127.0.0.1. El tunel de Cloudflare vive aparte (~/docker/cloudflared) y llega a estos
# contenedores por la red b2b_default: ips.devrojas.xyz -> web:3000 e ips-api.devrojas.xyz -> api:3001.
services:
  api:
    container_name: b2b-api
    image: b2b-api:latest
    env_file: .env
    environment:
      ENV: prod
      PORT: "3001"
      TZ: America/Bogota
    ports:
      - "127.0.0.1:3101:3001"
    restart: unless-stopped
  web:
    container_name: b2b-web
    image: b2b-web:latest
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:3100:3000"
    restart: unless-stopped
